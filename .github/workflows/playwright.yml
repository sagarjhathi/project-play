name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                    # pull your repo's code

      - uses: actions/setup-node@v4                    # install Node.js
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci                                     # NOT npm install — see your own notes on why

      - name: Install Playwright browsers
        run: npx playwright install --with-deps          # downloads browser binaries INTO the CI runner

      - name: Run tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4                # save the HTML report so you can view it after
        if: always()                                       # upload even if tests FAILED
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7